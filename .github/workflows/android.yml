name: Android CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted runners ship the Android SDK, but the required platform
      # may be missing. Install it directly instead of using setup-android,
      # which currently fails on the removed 'tools' package.
      - name: Ensure Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ ! -d "$SDK/platforms/android-34" ] && [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          fi
          echo "platforms: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Secret KEYSTORE_BASE64 is not set — the release APK will be debug-signed."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/kirtolat-release.jks
          {
            echo "storeFile=keystore/kirtolat-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/KirToLat-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/KirToLat-${GITHUB_REF_NAME}-release.apk"
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kirtolat-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "KirToLat ${GITHUB_REF_NAME}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
